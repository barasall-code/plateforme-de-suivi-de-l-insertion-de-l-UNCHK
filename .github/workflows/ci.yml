name: CI — UNCHK Platform

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  # ─── Backend ──────────────────────────────────────────────────────────────
  backend:
    name: Backend — Audit, Tests & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: unchk_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/unchk_test
      JWT_SECRET: ci-test-secret-key-unchk-2026
      JWT_REFRESH_SECRET: ci-test-refresh-secret-unchk-2026
      JWT_EXPIRES_IN: 15m
      REDIS_URL: ''
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Security audit (fail on high/critical)
        working-directory: backend
        run: npm audit --audit-level=high

      - name: TypeScript type check
        working-directory: backend
        run: npx tsc --noEmit

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Apply database migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Run unit tests with coverage
        working-directory: backend
        run: npm test -- --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

      - name: Build TypeScript
        working-directory: backend
        run: npm run build

      - name: Verify build artifact
        run: test -f backend/dist/index.js && echo "✅ Build OK" || (echo "❌ Build failed" && exit 1)

  # ─── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — Audit, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Security audit (fail on high/critical)
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: frontend
        run: npx eslint src --ext .ts,.tsx --max-warnings 10
        continue-on-error: true

      - name: Production build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: https://api.unchk.edu.sn/api

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 3

  # ─── Security audit report (main branch only) ─────────────────────────────
  security-report:
    name: Security — Full Audit Report
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Backend audit JSON report
        working-directory: backend
        run: |
          npm ci --prefer-offline
          npm audit --json > ../audit-backend.json || true

      - name: Frontend audit JSON report
        working-directory: frontend
        run: |
          npm ci --prefer-offline
          npm audit --json > ../audit-frontend.json || true

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-reports
          path: |
            audit-backend.json
            audit-frontend.json
          retention-days: 30

  # ─── Notify on failure ────────────────────────────────────────────────────
  notify:
    name: CI Status Summary
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()

    steps:
      - name: Report CI status
        run: |
          if [ "${{ needs.backend.result }}" = "failure" ] || [ "${{ needs.frontend.result }}" = "failure" ]; then
            echo "❌ CI Pipeline FAILED for branch: ${{ github.ref_name }}"
            echo "Commit: ${{ github.sha }} by ${{ github.actor }}"
            exit 1
          else
            echo "✅ CI Pipeline PASSED for branch: ${{ github.ref_name }}"
          fi
